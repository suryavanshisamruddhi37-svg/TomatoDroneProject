<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · CropCare AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/auth.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <div class="col-lg-6 d-none d-lg-flex auth-hero align-items-end p-5">
      <div class="text-white">
        <h2 class="fw-bold">Welcome Back!</h2>
        <p class="mb-0">Login to continue to CropCare AI</p>
      </div>
    </div>
    <div class="col-lg-6 d-flex align-items-center justify-content-center" style="min-height:100vh;">
      <form id="loginForm" class="w-100 px-4 auth-form-wrap" novalidate>
        <a href="index.html" class="brand mb-4 d-block text-decoration-none">CropCare <span>AI</span></a>
        <h3 class="fw-bold mb-1">Login to your account</h3>
        <p class="text-muted mb-4" style="font-size:.9rem;">Enter your credentials to continue.</p>

        <div id="loginAlert" class="alert alert-danger d-none py-2" role="alert"></div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label small text-muted" for="remember">Remember Me</label>
          </div>
          <a href="#" class="small" style="color:var(--green-600);text-decoration:none;">Forgot Password?</a>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-cc-primary w-100 py-2 fw-semibold">
          <span id="loginBtnText">Login</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
        </button>
        <p class="text-center small text-muted mt-3">
          Don't have an account? <a href="register.html" style="color:var(--green-600);font-weight:600;">Sign Up</a>
        </p>
      </form>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
