<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · CropCare AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <nav class="sidebar d-none d-md-flex flex-column p-3">
    <div class="brand mb-4 px-1">CropCare <span>AI</span></div>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="upload.html">Upload &amp; Detect</a>
    <a class="nav-link" href="history.html">Prediction History</a>
    <a class="nav-link" href="diseases.html">Tomato Diseases</a>
    <a class="nav-link" href="quality-guide.html">Quality Guide</a>
    <a class="nav-link active" href="profile.html">Profile</a>
    <a class="nav-link mt-auto text-danger" href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="flex-grow-1">
    <header class="d-flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom">
      <span class="fw-semibold d-md-none">CropCare AI</span>
      <div></div>
      <span id="userName" class="small fw-semibold">User</span>
    </header>

    <main class="p-4">
      <h3 class="fw-bold">Profile</h3>
      <p class="text-muted">Manage your account details.</p>

      <div class="card-cc p-4 mt-3" style="max-width:480px;">
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold"
               style="width:56px;height:56px;background:var(--green-600);font-size:1.3rem;">
            <span id="profileAvatarLetter">U</span>
          </div>
          <div>
            <div class="fw-semibold" id="profileHeaderName">—</div>
            <div class="small text-muted">CropCare AI member</div>
          </div>
        </div>

        <div id="profileAlert" class="alert d-none py-2"></div>

        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name</label>
            <input type="text" id="profileName" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold">Email <span class="text-muted">(Optional)</span></label>
            <input type="email" id="profileEmail" class="form-control" required>
          </div>
          <button type="submit" id="saveBtn" class="btn btn-cc-primary px-4">Save Changes</button>
        </form>
      </div>
    </main>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
