<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Diseases · CropCare AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <nav class="sidebar d-none d-md-flex flex-column p-3">
    <div class="brand mb-4 px-1">CropCare <span>AI</span></div>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="upload.html">Upload &amp; Detect</a>
    <a class="nav-link" href="history.html">Prediction History</a>
    <a class="nav-link active" href="diseases.html">Crop Diseases</a>
    <a class="nav-link" href="quality-guide.html">Quality Guide</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <a class="nav-link mt-auto text-danger" href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="flex-grow-1">
    <header class="d-flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom">
      <span class="fw-semibold d-md-none">CropCare AI</span>
      <div></div>
      <span id="userName" class="small fw-semibold">User</span>
    </header>

    <main class="p-4">
      <h3 class="fw-bold">Crop Diseases</h3>
      <p class="text-muted">Reference guide for diseases CropCare AI can detect, grouped by crop.</p>

      <div class="row g-3 mt-1" id="diseaseGrid"></div>
    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();
  loadUserBadge();

  // Static reference content — swap for a GET /api/diseases call later if
  // Member 2 wants this data-driven from the backend instead.
  const diseaseCatalog = [
    { crop: "Tomato", diseases: ["Early Blight", "Late Blight", "Septoria Leaf Spot"] },
    { crop: "Potato", diseases: ["Early Blight", "Late Blight", "Black Scurf"] },
    { crop: "Apple", diseases: ["Apple Scab", "Cedar Apple Rust", "Fire Blight"] },
    { crop: "Grapes", diseases: ["Powdery Mildew", "Black Rot", "Downy Mildew"] },
    { crop: "Chili", diseases: ["Leaf Curl", "Anthracnose", "Bacterial Wilt"] },
    { crop: "Corn", diseases: ["Common Rust", "Gray Leaf Spot", "Northern Leaf Blight"] },
    { crop: "Rice", diseases: ["Brown Spot", "Bacterial Blight", "Blast Disease"] },
  ];

  document.getElementById("diseaseGrid").innerHTML = diseaseCatalog
    .map(
      (c) => `
      <div class="col-md-6 col-lg-4">
        <div class="disease-card p-3 h-100">
          <h6 class="fw-semibold mb-2">${c.crop}</h6>
          <ul class="small text-muted ps-3 mb-0">
            ${c.diseases.map((d) => `<li>${d}</li>`).join("")}
          </ul>
        </div>
      </div>`
    )
    .join("");
</script>
</body>
</html>
