<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result · CropCare AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <nav class="sidebar d-none d-md-flex flex-column p-3">
    <div class="brand mb-4 px-1">CropCare <span>AI</span></div>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link active" href="upload.html">Upload &amp; Detect</a>
    <a class="nav-link" href="history.html">Prediction History</a>
    <a class="nav-link" href="diseases.html">Crop Diseases</a>
    <a class="nav-link" href="quality-guide.html">Quality Guide</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <a class="nav-link mt-auto text-danger" href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="flex-grow-1">
    <header class="d-flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom">
      <span class="fw-semibold d-md-none">CropCare AI</span>
      <div></div>
      <span id="userName" class="small fw-semibold">User</span>
    </header>

    <main class="p-4">
      <h3 class="fw-bold">Prediction Result</h3>
      <div id="resultContent" class="mt-3"></div>
      <div id="noResult" class="text-center text-muted py-5 d-none">
        No recent result found. <a href="upload.html">Upload an image</a> to get started.
      </div>
    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();
  loadUserBadge();

  function badgeClass(quality) {
    if (quality === "Good") return "badge-good";
    if (quality === "Average") return "badge-average";
    return "badge-poor";
  }

  const raw = sessionStorage.getItem("cc_last_result");
  const contentEl = document.getElementById("resultContent");
  const emptyEl = document.getElementById("noResult");

  if (!raw) {
    emptyEl.classList.remove("d-none");
  } else {
    const r = JSON.parse(raw);
    const diseaseColor = r.is_healthy ? "var(--green-600)" : "#c8392e";

    contentEl.innerHTML = `
      <div class="row g-4">
        <div class="col-lg-4">
          <img src="${r.image_url}" class="w-100 rounded-4" style="height:280px;object-fit:cover;">
          <a href="upload.html" class="btn btn-cc-primary w-100 mt-3">Upload Another Image</a>
        </div>
        <div class="col-lg-8">
          <div class="row g-3">
            <div class="col-sm-6">
              <div class="card-cc p-3">
                <div class="small text-muted">Detected Crop</div>
                <div class="fw-semibold fs-5">${r.crop}</div>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="card-cc p-3">
                <div class="small text-muted">Detected Condition</div>
                <div class="fw-semibold fs-5" style="color:${diseaseColor}">${r.disease}</div>
                <div class="small text-muted">Confidence: ${r.confidence}%</div>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="card-cc p-3">
                <div class="small text-muted">Quality Grade</div>
                <span class="badge ${badgeClass(r.quality)} fs-6">${r.quality}</span>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="card-cc p-3">
                <div class="small text-muted">Recommendation</div>
                <div class="small">${r.recommendation}</div>
              </div>
            </div>
            <div class="col-12">
              <div class="card-cc p-3">
                <h6 class="fw-semibold">About this result</h6>
                <p class="small text-muted mb-0">${r.description}</p>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
