<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction History · CropCare AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <nav class="sidebar d-none d-md-flex flex-column p-3">
    <div class="brand mb-4 px-1">CropCare <span>AI</span></div>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="upload.html">Upload &amp; Detect</a>
    <a class="nav-link active" href="history.html">Prediction History</a>
    <a class="nav-link" href="diseases.html">Crop Diseases</a>
    <a class="nav-link" href="quality-guide.html">Quality Guide</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <a class="nav-link mt-auto text-danger" href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="flex-grow-1">
    <header class="d-flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom">
      <span class="fw-semibold d-md-none">CropCare AI</span>
      <div></div>
      <span id="userName" class="small fw-semibold">User</span>
    </header>

    <main class="p-4">
      <h3 class="fw-bold">Prediction History</h3>
      <p class="text-muted">All your predictions</p>

      <div class="card-cc p-3 d-flex flex-wrap gap-3 align-items-end mb-3">
        <div>
          <label class="form-label small fw-semibold mb-1">From Date</label>
          <input type="date" id="fromDate" class="form-control form-control-sm">
        </div>
        <div>
          <label class="form-label small fw-semibold mb-1">To Date</label>
          <input type="date" id="toDate" class="form-control form-control-sm">
        </div>
        <div>
          <label class="form-label small fw-semibold mb-1">Crop</label>
          <select id="cropFilter" class="form-select form-select-sm">
            <option value="">All Crops</option>
            <option>Tomato</option><option>Potato</option><option>Apple</option>
            <option>Grapes</option><option>Chili</option><option>Corn</option>
            <option>Rice</option><option>Other</option>
          </select>
        </div>
        <button id="searchBtn" class="btn btn-cc-primary btn-sm">Search</button>
      </div>

      <div class="card-cc p-3">
        <div id="tableWrap" class="table-responsive"></div>
        <div id="emptyState" class="text-center text-muted py-5 d-none">No predictions found.</div>
        <div id="loadingState" class="text-center text-muted py-5">Loading…</div>
      </div>
    </main>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/history.js"></script>
</body>
</html>
